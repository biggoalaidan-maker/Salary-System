<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kidcastle 薪資變數關係圖</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: 帳本式的左→右資料流圖（可橫向捲動）＋右側明細欄；下方為完整「位置總表」 */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --ink: #15233F; --muted: #5B6B85; --line: #D9E0EA; --soft: #EAEFF5;
  --accent: #1D4ED8; --up: #1D4ED8; --down: #C2410C; --edge: #9AA8BC;
  --gP: #6D28D9; --gM: #0284C7; --gL: #94A3B8; --gH: #0F9488; --gF: #D97706; --gI: #EA580C;
  --gC: #16A34A; --gS: #1D4ED8; --gR: #DC2626; --gO: #334155;
  --font-display: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1524; --surface: #162036; --ink: #E6ECF5; --muted: #9AA9C1; --line: #2A3753; --soft: #1D2942;
  --accent: #7AA2FF; --up: #7AA2FF; --down: #FB923C; --edge: #4A5A78;
  --gP: #A78BFA; --gM: #38BDF8; --gL: #8A97AB; --gH: #2DD4BF; --gF: #FBBF24; --gI: #FB923C;
  --gC: #4ADE80; --gS: #7AA2FF; --gR: #F87171; --gO: #CBD5E1; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0E1524; --surface: #162036; --ink: #E6ECF5; --muted: #9AA9C1; --line: #2A3753; --soft: #1D2942;
  --accent: #7AA2FF; --up: #7AA2FF; --down: #FB923C; --edge: #4A5A78;
  --gP: #A78BFA; --gM: #38BDF8; --gL: #8A97AB; --gH: #2DD4BF; --gF: #FBBF24; --gI: #FB923C;
  --gC: #4ADE80; --gS: #7AA2FF; --gR: #F87171; --gO: #CBD5E1; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.6; padding-inline: 16px; padding-block: 20px 40px; }
.wrap { max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
header { display: grid; gap: 10px; }
h1 { font-family: var(--font-display); font-weight: 900; font-size: clamp(22px, 3vw, 30px); margin: 0; letter-spacing: .02em; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 70ch; }
.lede b.up { color: var(--up); } .lede b.down { color: var(--down); }
.flow { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12.5px; color: var(--muted); }
.flow span { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
.tools { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.tools input { font: inherit; padding: 8px 12px; border: 1.5px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); min-width: 0; width: 240px; max-width: 100%; }
.tools input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.canvas { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: auto; max-height: 78vh; min-width: 0; }
.canvas svg { display: block; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 16px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); max-height: 78vh; overflow-y: auto; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-size: 20px; margin: 6px 0 4px; }
.badge { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 9px; border-radius: 999px; color: var(--bg); letter-spacing: .04em; }
.sec { margin-top: 14px; }
.sec > b { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; letter-spacing: .03em; }
.formula { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-family: var(--font-mono); font-size: 12.5px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.chip { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 9px; border-radius: 999px; background: var(--soft); border: 1px solid var(--line); color: var(--ink); font: inherit; font-size: 12px; cursor: pointer; }
.chip:hover, .chip:focus-visible { border-color: var(--accent); outline: none; }
.go { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px; }
.go span { min-width: 0; }
.go a { flex-shrink: 0; text-decoration: none; background: var(--accent); color: var(--bg); font-weight: 700; font-size: 12px; padding: 6px 10px; border-radius: 6px; }
.go a:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
.note { font-size: 12px; color: var(--muted); }
.node { cursor: pointer; }
.node rect.box { fill: var(--surface); stroke-width: 1.5; }
.node text { font-size: 12.5px; font-weight: 600; fill: var(--ink); pointer-events: none; font-family: var(--font-body); }
.node:focus { outline: none; } .node:focus-visible rect.box { stroke-width: 3; }
.edge { fill: none; stroke: var(--edge); stroke-width: 1.2; opacity: .55; }
.colhead { font-size: 13px; font-weight: 900; fill: var(--ink); font-family: var(--font-display); }
.grphead { font-size: 11px; font-weight: 700; fill: var(--muted); letter-spacing: .04em; }
svg.dim .node:not(.on) { opacity: .2; } svg.dim .edge:not(.on) { opacity: .06; }
.edge.on { opacity: 1; stroke-width: 2.2; } .edge.on.up { stroke: var(--up); } .edge.on.down { stroke: var(--down); }
.node.sel rect.box { stroke: var(--ink); stroke-width: 3; }
@media (prefers-reduced-motion: no-preference) { .node, .edge { transition: opacity .15s; } }
section.table h2 { font-family: var(--font-display); font-size: 20px; margin: 8px 0; }
.tbl { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 900px; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { position: sticky; top: 0; background: var(--soft); font-size: 12px; color: var(--muted); letter-spacing: .03em; }
td.f { font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap; }
tr.grp td { background: var(--soft); font-weight: 900; }
td a { color: var(--accent); }
footer { color: var(--muted); font-size: 12px; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } .panel { position: static; max-height: none; } .canvas { max-height: 60vh; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>Kidcastle 薪資變數關係圖</h1>
    <p class="lede">點任一項目：<b class="up">藍線</b>是它用到的項目（上游），<b class="down">橘線</b>是它會影響的項目（下游）。右側會顯示公式、在哪裡輸入、誰可以改，按「前往」直接打開薪資系統的那一頁。</p>
    <div class="flow"><span>① 公式參數</span><span>② 每月／人數輸入</span><span>③ 員工固定金額</span><span>④ 自動計算</span><span>⑤ 小計 A／B／C／D</span><span>⑥ 實領・應發</span><span>⑦ 輸出</span></div>
    <div class="tools">
      <label for="q" class="note">搜尋</label>
      <input id="q" type="search" placeholder="例如：考試津貼、實領" autocomplete="off">
      <div class="legend" id="legend"></div>
    </div>
  </header>

  <div class="main">
    <div class="canvas" id="canvas" aria-label="變數關係圖"></div>
    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>

  <section class="table">
    <h2>位置總表</h2>
    <p class="note">每個項目的公式、上下游與位置。點項目名稱會在上方圖中標出。</p>
    <div class="tbl"><table id="tbl"></table></div>
  </section>

  <footer>版本 V20261023V1500 · 「前往」連到線上薪資系統，需要先登入；系統內也可從右上角「🗺 關係圖」開啟同一張圖。</footer>
</div>

// 薪資系統網址：放在系統資料夾（GitHub Pages／本機）時用相對路徑，其他地方（例如線上分享）用完整網址
const SITE = 'https://wufatw-bot.github.io/NewKidcastleSalarySystem/';
const BASE = (location.protocol === 'file:' || /github\.io$/.test(location.hostname)) ? '' : SITE;
const G = {
  P: '公式參數', M: '每月輸入', L: '已停用的每月欄位', H: '員工人數／時數', F: '員工固定金額',
  I: '勞健保／退休金', C: '自動計算', S: '小計', R: '結果', O: '輸出／頁面'
};
const COLS = ['① 公式參數', '② 每月／人數輸入', '③ 員工固定金額', '④ 自動計算', '⑤ 小計', '⑥ 結果', '⑦ 輸出'];
const by = {}; NODES.forEach(n => by[n.id] = n);
const kids = {}; NODES.forEach(n => n.deps.forEach(d => (kids[d] = kids[d] || []).push(n.id)));
const esc = s => String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const $ = id => document.getElementById(id);

function hrefFor(n, i) {
  const g = n.where[i].go;
  if (g.url) return BASE + g.url;
  return BASE + 'index.html#goto=' + encodeURIComponent(n.id + ':' + i);
}

// ── 圖 ──
const NW = 156, NH = 30, GAP = 7, COLW = 206, TOP = 44, LEFT = 16, GH = 22;
const pos = {};
(function build() {
  const colY = COLS.map(() => TOP), lastG = {}; let heads = '', edges = '', nodes = '';
  COLS.forEach((c, i) => heads += `<text class="colhead" x="${LEFT + i * COLW}" y="24">${c}</text>`);
  NODES.forEach(n => {
    if (lastG[n.col] !== n.g) { colY[n.col] += (lastG[n.col] ? 10 : 0) + GH; lastG[n.col] = n.g; n.head = true; }
    pos[n.id] = { x: LEFT + n.col * COLW, y: colY[n.col] }; colY[n.col] += NH + GAP;
  });
  NODES.forEach(n => {
    const p = pos[n.id];
    if (n.head) heads += `<text class="grphead" x="${p.x}" y="${p.y - 7}">${esc(G[n.g])}</text>`;
    n.deps.forEach(d => {
      const a = pos[d]; if (!a) return;
      const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = p.x, y2 = p.y + NH / 2, mx = (x1 + x2) / 2;
      edges += `<path class="edge" data-from="${esc(d)}" data-to="${esc(n.id)}" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}"/>`;
    });
    const short = n.label.length > 11 ? n.label.slice(0, 11) + '…' : n.label;
    nodes += `<g class="node" tabindex="0" role="button" aria-label="${esc(n.label)}" data-id="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <title>${esc(n.label)}</title>
      <rect class="box" width="${NW}" height="${NH}" rx="7" style="stroke:var(--g${n.g})"/>
      <rect width="6" height="${NH}" rx="3" style="fill:var(--g${n.g})"/>
      <text x="14" y="${NH / 2 + 4.5}">${esc(short)}</text></g>`;
  });
  const w = LEFT * 2 + (COLS.length - 1) * COLW + NW, h = Math.max(...colY) + 16;
  $('canvas').innerHTML = `<svg id="svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${heads}${edges}${nodes}</svg>`;
  $('legend').innerHTML = Object.entries(G).map(([k, v]) => `<span><i style="background:var(--g${k})"></i>${v}</span>`).join('');
})();

function walk(id, f, acc) { (f(id) || []).forEach(x => { if (!acc.has(x)) { acc.add(x); walk(x, f, acc); } }); return acc; }
function select(id, scroll) {
  const svg = $('svg');
  svg.querySelectorAll('.on,.sel,.up,.down').forEach(e => e.classList.remove('on', 'sel', 'up', 'down'));
  if (!id) { svg.classList.remove('dim'); panel(null); return; }
  const up = walk(id, x => by[x] ? by[x].deps : [], new Set()), down = walk(id, x => kids[x], new Set());
  svg.classList.add('dim');
  [id, ...up, ...down].forEach(x => { const g = svg.querySelector(`.node[data-id="${CSS.escape(x)}"]`); if (g) g.classList.add('on'); });
  const sel = svg.querySelector(`.node[data-id="${CSS.escape(id)}"]`); sel.classList.add('sel');
  svg.querySelectorAll('.edge').forEach(e => {
    const f = e.dataset.from, t = e.dataset.to;
    if ((t === id || up.has(t)) && up.has(f)) e.classList.add('on', 'up');
    else if ((f === id || down.has(f)) && down.has(t)) e.classList.add('on', 'down');
  });
  panel(id);
  if (scroll) {
    const c = $('canvas'), p = pos[id];
    c.scrollTo({ left: Math.max(0, p.x - c.clientWidth / 2 + NW / 2), top: Math.max(0, p.y - c.clientHeight / 2), behavior: 'smooth' });
  }
}
const chips = ids => ids.length ? ids.map(x => `<button type="button" class="chip" data-go="${esc(x)}">${esc(by[x].label)}</button>`).join('') : '<span class="note">（無）</span>';
function panel(id) {
  const p = $('panel');
  if (!id) {
    p.innerHTML = `<span class="badge" style="background:var(--ink)">說明</span><h2>從右邊往左看最快</h2>
      <p>想知道「實領」為什麼是這個數字？點最右邊的項目，藍線會一路標出它用到的每個數字。想知道改一個數字會影響什麼？點左邊的項目看橘線。</p>
      <div class="sec"><b>常用項目</b>${chips(['實領', 'B', '加班費', '全勤獎金實發', '帶班人數津貼', '考試津貼'])}</div>`;
    return;
  }
  const n = by[id];
  const go = n.where.map((w, i) => `<div class="go"><span>${esc(w.text)}</span><a href="${esc(hrefFor(n, i))}" target="_blank" rel="noopener">前往 →</a></div>`).join('');
  p.innerHTML = `<span class="badge" style="background:var(--g${n.g})">${esc(G[n.g])}</span>
    <h2>${esc(n.label)}</h2><div>${esc(n.desc)}</div>
    ${n.formula ? `<div class="sec"><b>公式／預設值</b><div class="formula">${esc(n.formula)}</div></div>` : ''}
    <div class="sec"><b>用到（上游）</b>${chips(n.deps)}</div>
    <div class="sec"><b>影響（下游）</b>${chips(kids[id] || [])}</div>
    <div class="sec"><b>位置</b>${go}<div class="note">薪資系統頁面需要先登入，登入後會自動跳到這個欄位。</div></div>
    <div class="sec"><b>誰可以改</b>${esc(n.who)}</div>`;
}
document.addEventListener('click', e => {
  const c = e.target.closest('[data-go]'); if (c) { select(c.dataset.go, true); return; }
  const g = e.target.closest('.node'); if (g) { select(g.dataset.id, false); return; }
  if (e.target.closest('#canvas') && (e.target.tagName === 'svg' || e.target.id === 'canvas')) select(null);
});
document.addEventListener('keydown', e => {
  const g = e.target.closest && e.target.closest('.node');
  if (g && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(g.dataset.id, false); }
});
$('q').addEventListener('input', e => {
  const q = e.target.value.trim(); if (!q) return;
  const hit = NODES.find(n => n.label.includes(q) || n.id.includes(q)); if (hit) select(hit.id, true);
});

// ── 位置總表 ──
(function table() {
  let html = '<thead><tr><th>項目</th><th>公式／說明</th><th>用到（上游）</th><th>影響（下游）</th><th>位置</th><th>誰可以改</th></tr></thead><tbody>';
  COLS.forEach((c, i) => {
    html += `<tr class="grp"><td colspan="6">${c}</td></tr>`;
    NODES.filter(n => n.col === i).forEach(n => {
      html += `<tr><td><button type="button" class="chip" data-go="${esc(n.id)}">${esc(n.label)}</button></td>
        <td class="f">${esc(n.formula || n.desc)}</td>
        <td>${n.deps.map(d => esc(by[d].label)).join('、') || '—'}</td>
        <td>${(kids[n.id] || []).map(d => esc(by[d].label)).join('、') || '—'}</td>
        <td>${n.where.map((w, j) => `<a href="${esc(hrefFor(n, j))}" target="_blank" rel="noopener">${esc(w.text)}</a>`).join('<br>')}</td>
        <td>${esc(n.who)}</td></tr>`;
    });
  });
  $('tbl').innerHTML = html + '</tbody>';
})();
select('實領', false);
</script>

</body>
</html>
